<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat with your Documents</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
      body {
        background-color: #f4f7f9;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .chat-container {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .message {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      .message .message-bubble {
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 70%;
        word-wrap: break-word;
      }
      .user-message {
        align-items: flex-end;
      }
      .user-message .message-bubble {
        background-color: #007bff;
        color: white;
        border-bottom-right-radius: 5px;
      }
      .bot-message {
        align-items: flex-start;
      }
      .bot-message .message-bubble {
        background-color: #e9ecef;
        color: #333;
        border-bottom-left-radius: 5px;
      }
      .chat-form {
        padding: 15px;
        background-color: #fff;
        border-top: 1px solid #dee2e6;
      }
      .navbar {
        background: linear-gradient(to right, #6a11cb, #2575fc);
      }
      .navbar-brand {
        color: white !important;
        font-weight: bold;
      }
      .navbar-brand:hover {
        color: #f8f9fa !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <a class="navbar-brand" href="/">
        <i class="fas fa-robot"></i> RAG ChatBot
      </a>
    </nav>

    <div class="chat-container" id="chat-container">
      {% if chat_history %} {% for i in range(0, chat_history|length, 2) %}
      <div class="message user-message">
        <div class="message-bubble">{{ chat_history[i] }}</div>
      </div>
      {% if i + 1 < chat_history|length %}
      <div class="message bot-message">
        <div class="message-bubble">{{ chat_history[i+1] | safe }}</div>
      </div>
      {% endif %} {% endfor %} {% else %}
      <div class="text-center text-muted mt-5">
        <p>No messages yet. Start the conversation!</p>
      </div>
      {% endif %}
    </div>

    <div class="chat-form">
      <form action="/chat" method="POST" class="w-100">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            name="question"
            placeholder="Ask a question..."
            autocomplete="off"
            required
          />
          <div class="input-group-append">
            <button class="btn btn-primary" type="submit">
              <i class="fas fa-paper-plane"></i> Send
            </button>
          </div>
        </div>
      </form>
    </div>

    <script>
      // Auto-scroll to the bottom of the chat container
      const chatContainer = document.getElementById("chat-container");
      chatContainer.scrollTop = chatContainer.scrollHeight;
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
